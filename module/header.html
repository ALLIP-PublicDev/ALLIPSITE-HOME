<style>
  /* ===== Header 2026 Modern Trend ===== */
  .nav-wrapper {

  .logo img {

  }

    display: inline-flex;
    align-items: center;
    gap: 6px;

  .mall-btn:hover {
    background-color: #1e87bb;
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(37, 160, 219, 0.3);
  }

  /* 모바일 최적화 */
  @media (max-width: 768px) {
    .nav-right {
      gap: 16px;
    }
    .menu a {
      font-size: 14px;

    }
    .mall-btn {
